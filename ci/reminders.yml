name: Reminders

# Times below are UTC. Each reminder has crons for both AEST (UTC+10) and
# AEDT (UTC+11); main.py gates on real Australia/Sydney time, so only the
# firing that maps to the correct local time actually sends — DST is handled
# automatically, no seasonal edits needed.
#
# Each reminder also has a CATCH-UP cron ~20 min after the primary, because
# GitHub silently drops scheduled ticks under load (worst at :00/:30, which is
# also why the minutes are offset). Duplicates are prevented by state/sent.json,
# which records what was sent today and is committed back by this workflow.
on:
  schedule:
    # Exercise — daily 05:30 Sydney
    - cron: "37 19 * * *"   # AEST ~05:37 local
    - cron: "57 19 * * *"   # AEST catch-up ~05:57
    - cron: "37 18 * * *"   # AEDT ~05:37 local
    - cron: "57 18 * * *"   # AEDT catch-up ~05:57
    # Dinner (daily) — 15:00 Sydney
    - cron: "7 5 * * *"     # AEST ~15:07
    - cron: "27 5 * * *"    # AEST catch-up ~15:27
    - cron: "7 4 * * *"     # AEDT ~15:07
    - cron: "27 4 * * *"    # AEDT catch-up ~15:27
    # Dinner (weekly) — Saturday 09:00 Sydney  (Fri in UTC)
    - cron: "7 23 * * 5"    # AEST ~09:07 Sat
    - cron: "27 23 * * 5"   # AEST catch-up ~09:27 Sat
    - cron: "7 22 * * 5"    # AEDT ~09:07 Sat
    - cron: "27 22 * * 5"   # AEDT catch-up ~09:27 Sat
    # Training summary — Sunday 18:00 Sydney
    - cron: "7 8 * * 0"     # AEST ~18:07
    - cron: "27 8 * * 0"    # AEST catch-up ~18:27
    - cron: "7 7 * * 0"     # AEDT ~18:07
    - cron: "27 7 * * 0"    # AEDT catch-up ~18:27
  workflow_dispatch:
    inputs:
      reminder:
        description: "Force-send a reminder (bypasses the time gate)"
        required: true
        default: "exercise"
        type: choice
        options:
          - exercise
          - dinner_daily
          - dinner_weekly
          - training_summary
          - all
      dry_run:
        description: "Print instead of sending"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # to commit state/sent.json (dedup + keepalive)

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run reminder
        env:
          EXERCISE_BOT_TOKEN: ${{ secrets.EXERCISE_BOT_TOKEN }}
          EXERCISE_CHAT_ID: ${{ secrets.EXERCISE_CHAT_ID }}
          DINNER_BOT_TOKEN: ${{ secrets.DINNER_BOT_TOKEN }}
          DINNER_CHAT_ID: ${{ secrets.DINNER_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_REMINDER: ${{ github.event.inputs.reminder }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python -m src.main
      - name: Commit sent-state (dedup + keepalive)
        if: github.event_name == 'schedule'
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "reminders-bot"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "Record sent reminders [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
